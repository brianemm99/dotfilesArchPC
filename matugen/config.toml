[config]

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.config/quickshell/Theme/colors.json"

[templates.hyprcolors]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.cache/matugen/hypr-colors.lua"
post_hook = "hyprctl reload"

[templates.tmux]
input_path = "~/.config/matugen/templates/tmux-colors.conf"
output_path = "~/.cache/matugen/tmux-colors.conf"
post_hook = "sh -c 'tmux source-file ~/.cache/matugen/tmux-colors.conf 2>/dev/null || true'"
